<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join MatchVibe</title>
    <meta name="description" content="Download MatchVibe and join as a host with a referral code." />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: radial-gradient(circle at top, #1a1033 0%, #09090b 55%);
        color: #fafafa;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        background: rgba(9, 9, 11, 0.85);
        padding: 28px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 24px auto 0;
        border: 3px solid rgba(139, 92, 246, 0.25);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      a {
        display: inline-block;
        margin-top: 20px;
        color: #a78bfa;
        text-decoration: none;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Opening MatchVibe…</h1>
      <p id="status">If the app is installed, it will open with your referral code.</p>
      <div class="spinner" aria-hidden="true"></div>
      <a id="fallback" href="#" hidden>Continue to Google Play</a>
    </div>
    <script>
      (function () {
        var PLAY_STORE =
          'https://play.google.com/store/apps/details?id=com.matchvibe.app';
        var params = new URLSearchParams(window.location.search);
        var ref = (params.get('ref') || '').trim();
        var isAndroid = /Android/i.test(navigator.userAgent);

        function playStoreUrl() {
          if (!ref) return PLAY_STORE;
          return (
            PLAY_STORE + '&referrer=' + encodeURIComponent('ref=' + ref)
          );
        }

        function appSchemeUrl() {
          if (!ref) return 'app://signup';
          return (
            'app://signup?ref=' + encodeURIComponent(ref.toUpperCase())
          );
        }

        var store = playStoreUrl();
        var fallback = document.getElementById('fallback');
        fallback.href = store;
        fallback.hidden = false;

        if (!isAndroid) {
          document.getElementById('status').textContent =
            'Redirecting you to Google Play…';
          window.location.replace(store);
          return;
        }

        if (ref) {
          window.location.href = appSchemeUrl();
        }

        window.setTimeout(function () {
          document.getElementById('status').textContent =
            'Redirecting you to Google Play…';
          window.location.replace(store);
        }, ref ? 2200 : 0);
      })();
    </script>
  </body>
</html>
